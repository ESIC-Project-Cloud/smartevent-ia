apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
  spec:
    securityContext:
      runAsNonRoot: true
    nodeSelector:
      role: micro
  containers:
  - name: auth-service
    securityContext:
      allowPrivilegeEscalation: false
    image: registry.gitlab.com/smarteventapp/auth-service:main
    imagePullPolicy: Always
    ports:
    - containerPort: 8091
    env:
    - name: SPRING_PROFILES_ACTIVE
      value: "docker"
    - name: SPRING_CLOUD_CONFIG_URI
      value: "http://config-server:8888"
    - name: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
      value: "http://eureka-server:30000/eureka/"
    resources:
      requests:
        memory: "128Mi"
        cpu: "50m"
      limits:
        memory: "512Mi"
        cpu: "500m"
