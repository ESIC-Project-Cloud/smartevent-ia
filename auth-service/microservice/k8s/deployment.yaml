apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      nodeSelector:
        role: micro   # ⚠️ BACKEND → node micro (TP)
      securityContext:
        runAsNonRoot: true
      containers:
        - name: auth-service
          image: registry.gitlab.com/smarteventapp/auth-service:main
          imagePullPolicy: Always
          ports:
            - containerPort: 8091
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"

            - name: SPRING_CLOUD_CONFIG_URI
              value: "http://config-server:8888"

            - name: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
              value: "http://eureka-server:8761/eureka/"

          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
